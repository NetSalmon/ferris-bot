[package]
name = "ferris-bot"
version = "0.1.0"
edition = "2024"
authors = ["netsalmon@disroot.org"]
description = "A simple rust ai agent"
license = "GPL-3.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["stream"] }
axum = "0.8.8"
futures-util = "0.3.32"
async-stream = "0.3.6"
tower-http = { version = "0.6.8", features = ["cors"] }
thiserror = "2.0.18"
url = "2.5.2"
dotenvy = "0.15.7"
uuid = { version = "1.22.0", features = ["v4", "serde"]}
dashmap = "7.0.0-rc2"
ctor = "0.6.3"